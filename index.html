.spring-card:hover { border-color: rgba(212,118,44,0.4); }

.card-illustration {

// App state
let currentTab = 'home';
let currentRegion = 'all';
let currentDiff = 'all';
let collection = JSON.parse(localStorage.getItem('spring_collection') || '[]');

// Region display config
const regionEmoji = { '北': '🗻', '中': '🏔️', '南': '🌋', '東': '🌊' };
const regionClass = { '北': 'region-north', '中': 'region-central', '南': 'region-south', '東': 'region-east' };

// Difficulty helpers
function getDiffLevel(d) {
  if (d <= 3) return 'beginner';
  if (d <= 7) return 'intermediate';
  return 'expert';
}
function getDiffLabel(d) {
  if (d <= 3) return '🌱新手';
  if (d <= 7) return '⛰️中級';
  return '🔥老手';
}
function getDiffBadge(d) {
  if (d <= 3) return 'badge-newbie';
  if (d <= 7) return 'badge-intermediate';
  return 'badge-expert';
}
function getStars(d) {
  const filled = Math.round((d / 15) * 5);
  return '★'.repeat(filled) + '☆'.repeat(5 - filled);
}

// SVG mountain/steam illustration
function getCardSVG(region) {
  const colors = {
    '北': { stroke: '#4A5C3A', steam: '#C04A1A' },
    '中': { stroke: '#5C3A3A', steam: '#D4762C' },
    '南': { stroke: '#3A3A5C', steam: '#5B7B8A' },
    '東': { stroke: '#3A5C5C', steam: '#5B7B8A' }
  };
  const c = colors[region] || colors['北'];
  return `<svg viewBox="0 0 200 80" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="steam-${region}" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="${c.steam}" stop-opacity="0"/>
        <stop offset="50%" stop-color="${c.steam}" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="${c.steam}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- Mountains -->
    <path d="M0 80 L30 40 L50 60 L80 25 L110 55 L130 35 L160 50 L200 80 Z" fill="none" stroke="${c.stroke}" stroke-width="1.5" opacity="0.5"/>
    <path d="M20 80 L60 30 L90 55 L130 20 L160 45 L200 80" fill="none" stroke="${c.stroke}" stroke-width="1" opacity="0.3"/>
    <!-- Steam rises -->
    <path d="M85 55 Q80 40 85 25 Q90 10 85 -5" stroke="url(#steam-${region})" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M100 50 Q95 35 100 20 Q105 5 100 -10" stroke="url(#steam-${region})" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M115 55 Q110 40 115 25 Q120 10 115 -5" stroke="url(#steam-${region})" stroke-width="3" fill="none" opacity="0.7"/>
  </svg>`;
}

// Create spring card HTML
function createSpringCard(spring) {
  const isSaved = collection.includes(spring.ID);
  const diffLevel = getDiffLevel(spring.Difficulty);
  const diffLabel = getDiffLabel(spring.Difficulty);
  const diffBadge = getDiffBadge(spring.Difficulty);
  const stars = getStars(spring.Difficulty);
  const regionIcon = regionEmoji[spring.Region] || '🌊';
  const regionCls = regionClass[spring.Region] || 'region-east';
  const hasDesc = spring.Description && spring.Description.trim();
  
  return `<div class="spring-card" data-id="${spring.ID}" data-region="${spring.Region}" data-diff="${diffLevel}">
  <div class="card-illustration ${regionCls}">
    ${getCardSVG(spring.Region)}
    <span class="calligraphy">${spring.Name}</span>
  </div>
  <div class="card-header">
    <div class="card-title-row">
      <span class="card-name">${spring.Name}</span>
      <button class="fav-btn ${isSaved ? 'saved' : ''}" data-id="${spring.ID}">${isSaved ? '❤️' : '🤍'}</button>
    </div>
    <div class="card-region">${regionIcon} ${spring.Region}區</div>
    <div class="card-badges">
      <span class="badge badge-type">${spring.Type}</span>
      <span class="badge badge-season">${spring.Season}</span>
      <span class="badge badge-difficulty ${diffBadge}">${diffLabel} <span class="stars">${stars}</span></span>
    </div>
  </div>
  <div class="card-description ${hasDesc && spring.Description.includes('毒') ? 'warning' : ''}">${spring.Description || '無'}</div>
  <div class="card-details">
    <div class="detail-item">
      <div class="detail-label">路線</div>
      <div class="detail-value">${spring.Route}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">裝備</div>
      <div class="detail-value">${spring.Gear}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">管制</div>
      <div class="detail-value">${spring.GuanZhi}</div>
    </div>
  </div>
</div>`;
}

// Filter springs
function filterSprings() {
  return springs.filter(s => {
    const matchRegion = currentRegion === 'all' || s.Region === currentRegion;
    const matchDiff = currentDiff === 'all' || getDiffLevel(s.Difficulty) === currentDiff;
    const matchCollection = currentTab !== 'collection' || collection.includes(s.ID);
    return matchRegion && matchDiff && matchCollection;
  });
}

// Render spring list
function renderSprings() {
  const grid = document.getElementById('spring-grid');
  const empty = document.getElementById('empty-state');
  const filtered = filterSprings();
  
  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
  } else {
    empty.classList.add('hidden');
    grid.innerHTML = filtered.map(createSpringCard).join('');
  }
  
  // Update stats
  const statsText = document.getElementById('stats-text');
  const collectionCount = document.getElementById('collection-count');
  if (currentTab === 'collection') {
    statsText.textContent = `我的收藏 ${filtered.length} 處`;
  } else {
    statsText.textContent = `共 ${filtered.length} 處溫泉`;
  }
  collectionCount.textContent = collection.length > 0 ? `❤️ ${collection.length}` : '';
}

// Toggle favorite
function toggleFavorite(id, e) {
  if (e) e.stopPropagation();
  const idx = collection.indexOf(id);
  if (idx === -1) {
    collection.push(id);
  } else {
    collection.splice(idx, 1);
  }
  localStorage.setItem('spring_collection', JSON.stringify(collection));
  renderSprings();
}

// Card click handler
document.addEventListener('click', (e) => {
  const card = e.target.closest('.spring-card');
  const favBtn = e.target.closest('.fav-btn');
  
  if (favBtn) {
    toggleFavorite(favBtn.dataset.id, e);
    return;
  }
  
  if (card) {
    card.classList.toggle('expanded');
  }
});

// Filter click handlers
document.querySelectorAll('#region-filters .filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#region-filters .filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentRegion = chip.dataset.region;
    renderSprings();
  });
});

document.querySelectorAll('#difficulty-filters .filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#difficulty-filters .filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentDiff = chip.dataset.diff;
    renderSprings();
  });
});

// Tab navigation
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.tab === tab);
  });
  document.querySelectorAll('.nav-link').forEach(n => {
    n.classList.toggle('active', n.dataset.tab === tab);
  });
  
  const statsText = document.getElementById('stats-text');
  if (tab === 'collection') {
    statsText.textContent = `我的收藏 ${collection.length} 處`;
  } else {
    renderSprings();
  }
  renderSprings();
}

document.querySelectorAll('.nav-item, .nav-link').forEach(n => {
  n.addEventListener('click', (e) => {
    e.preventDefault();
    setTab(n.dataset.tab);
  });
});

// Desktop sidebar toggle on mobile screens
function checkDesktop() {
  if (window.innerWidth >= 768) {
    document.querySelector('.sidebar').classList.remove('hidden');
  } else {
    document.querySelector('.sidebar').classList.add('hidden');
  }
}

// Init
window.addEventListener('resize', checkDesktop);
checkDesktop();
renderSprings();
</script>
